name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/build.mjs
      - run: node tools/verify-lint.mjs
      - run: node tools/verify-roster.mjs
      - run: node tools/verify-bundle.mjs
      - run: node tools/verify-choices.mjs
      - run: node tools/verify-mock.mjs
      - run: node tools/verify-probe.mjs
      - run: node tools/verify-filler.mjs
      - run: node tools/verify-q4test.mjs
      - run: node tools/verify-browser.mjs
      # NOTE: verify-excel.ps1 requires Excel COM automation which is not available on GitHub-hosted runners
      # Run it locally on Windows with Excel installed
