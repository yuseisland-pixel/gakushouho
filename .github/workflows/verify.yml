name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 名簿テンプレートは著作権配慮でリポジトリに含めず、アプリと同じ CDN から取得する
      - name: Fetch roster template
        run: |
          New-Item -ItemType Directory -Force src/template | Out-Null
          curl.exe -fsSL -o "src/template/参加者名簿.xlsx" "https://res.cloudinary.com/xx1zwaop/raw/upload/%E5%AD%A6%E5%82%B7%E8%A3%9C_%E5%AD%A6%E8%B3%A0%E8%A3%9C_%E6%B4%BB%E5%8B%95%E5%B1%8A%E7%94%A8_%E5%8F%82%E5%8A%A0%E8%80%85%E5%90%8D%E7%B0%BF.xlsx"
      - run: node tools/build.mjs
      - run: node tools/verify-lint.mjs
      - run: node tools/verify-roster.mjs
      - run: node tools/verify-bundle.mjs
      - run: node tools/verify-choices.mjs
      - run: node tools/verify-mock.mjs
      - run: node tools/verify-probe.mjs
      - run: node tools/verify-filler.mjs
      - run: node tools/verify-browser.mjs
      # NOTE: verify-excel.ps1 requires Excel COM automation which is not available on GitHub-hosted runners
      # Run it locally on Windows with Excel installed
